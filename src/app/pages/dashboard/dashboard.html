<!-- HEADER -->
<header class="header">
  <!-- Bouton hamburger visible uniquement sur mobile -->
  <div class="menu-toggle d-md-none" (click)="toggleSidebarMobile()">
    <i class="fas fa-bars"></i>
  </div>

  <!-- Titre -->
  <div class="greeting">Gestion de stock</div>

  <!-- Actions -->
  <div class="header-actions">
    <div class="icon-btn theme-toggle" (click)="toggleTheme()">
      <i class="fas fa-moon"></i>
    </div>
  </div>
</header>

<!-- DASHBOARD -->
<div class="dashboard">
  <!-- SIDEBAR -->
  <aside class="sidebar"
         [class.collapsed]="collapsed"
         [class.open]="isMobileOpen">
    <app-sidebar></app-sidebar>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content" [class.expanded]="!collapsed && !isMobileOpen">
    <app-content></app-content>
  </main>
</div>

<!-- OVERLAY MOBILE -->
@if(isMobileOpen){
  <div class="overlay d-md-none" (click)="toggleSidebarMobile()"></div>
}
