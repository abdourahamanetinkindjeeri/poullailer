<nav class="sidebar-nav d-flex flex-column vh-100 bg-dark text-white">

  <!-- HEADER -->
  <div class="sidebar-header p-3 flex-shrink-0 border-bottom border-secondary border-opacity-10">
    <div class="logo-container d-flex align-items-center gap-2">
      <div
        class="logo d-flex align-items-center justify-content-center bg-primary rounded-2 shadow-sm"
        style="width: 35px; height: 35px;">
        <i class="fas fa-box text-white"></i>
      </div>

      @if (!collapsed){
      <div class="logo-text">
        <h2 class="h6 mb-0 fw-bold text-white">Gestion de stock</h2>
        <p class="small mb-0 text-muted">By Jeeri</p>
      </div>
      }
    </div>
  </div>

  <!-- MENU (SCROLLABLE) -->
  <div class="nav-content flex-grow-1 overflow-auto px-2 py-2">

    <ng-container *ngFor="let menu of menuList">

      <!-- MENU ITEM -->
      <div
        class="nav-item d-flex align-items-center justify-content-between p-2 mb-1 rounded-2 pointer"
        [ngClass]="{ 'active bg-primary bg-opacity-25': menu.active }"
        (click)="menu.sousMenu ? toggleMenu(menu) : navigate(menu)">

        <div class="d-flex align-items-center text-truncate">
          <i [class]="menu.icon" class="fs-5"></i>
          <span class="ms-3 fw-medium text-truncate" *ngIf="!collapsed">
            {{ menu.titre }}
          </span>
        </div>

        <i
          class="fas fa-chevron-down small transition"
          *ngIf="menu.sousMenu && !collapsed"
          [ngClass]="{ 'rotate-180': menu.open }">
        </i>
      </div>

      <!-- SUB MENU -->
      <div class="sub-menu mb-2" *ngIf="menu.sousMenu && menu.open && !collapsed">
        <div
          *ngFor="let sub of menu.sousMenu"
          class="nav-item d-flex align-items-center ms-4 p-2 rounded-2 pointer small"
          [ngClass]="{ 'active bg-primary bg-opacity-25': sub.active }"
          (click)="navigate(sub)">
          <i [class]="sub.icon"></i>
          <span class="ms-2 text-truncate">{{ sub.titre }}</span>
        </div>
      </div>

    </ng-container>

  </div>

  <!-- FOOTER (TOUJOURS EN BAS) -->
  <div
    class="sidebar-footer mt-auto border-top border-secondary border-opacity-10 p-3"
    *ngIf="!collapsed">

    <div
      class="user-profile d-flex align-items-center gap-2 bg-dark bg-opacity-25 p-2 rounded-3 border border-secondary border-opacity-10">

      <div
        class="user-avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold shadow-sm"
        style="width: 38px; height: 38px; min-width: 38px;">
        AB
      </div>

      <div class="user-info flex-grow-1 overflow-hidden">
        <div class="user-name text-white fw-bold text-truncate small">
          Ali Bouali
        </div>
        <div class="user-role text-muted text-truncate" style="font-size: 0.7rem;">
          Administrateur
        </div>
      </div>

      <i class="fas fa-ellipsis-v text-muted px-1 pointer small"></i>
    </div>

  </div>

</nav>
