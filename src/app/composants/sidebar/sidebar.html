<nav class="sidebar-fixed d-flex flex-column bg-dark text-white">

  <div class="sidebar-header p-3 flex-shrink-0 border-bottom border-secondary border-opacity-10">
    <div class="logo-container d-flex align-items-center gap-2">
      <div class="logo d-flex align-items-center justify-content-center bg-primary rounded-2 shadow-sm"
           style="min-width: 35px; height: 35px;">
        <i class="fas fa-box text-white"></i>
      </div>
      <div class="logo-text" *ngIf="!collapsed">
        <h2 class="h6 mb-0 fw-bold text-white">Gestion de stock</h2>
        <p class="small mb-0 text-muted" style="font-size: 0.7rem;">By Jeeri</p>
      </div>
    </div>
  </div>

  <div class="nav-content px-2 py-2 flex-grow-1" style="overflow-y: auto; overflow-x: hidden; min-height: 0;">

    <ng-container *ngFor="let menu of menuList">
      <div class="nav-item d-flex align-items-center justify-content-between p-2 mb-1 rounded-2 pointer transition-all"
           [ngClass]="{ 'active bg-primary bg-opacity-25': menu.active }"
           (click)="menu.sousMenu ? toggleMenu(menu) : navigate(menu)">

        <div class="d-flex align-items-center text-truncate">
          <i [ngClass]="menu.icon" class="fs-5" style="min-width: 30px;"></i>
          <span class="ms-2 fw-medium text-truncate" *ngIf="!collapsed">{{ menu.titre }}</span>
        </div>

        <i class="fas fa-chevron-down small transition-transform"
           *ngIf="menu.sousMenu && !collapsed"
           [ngClass]="{ 'rotate-180': menu.open }"></i>
      </div>

      <div class="sub-menu-container mb-2" *ngIf="menu.sousMenu && menu.open && !collapsed">
        <div *ngFor="let sub of menu.sousMenu"
             class="nav-item d-flex align-items-center ms-4 p-2 rounded-2 pointer small transition-all"
             [ngClass]="{ 'active text-primary': sub.active }"
             (click)="navigate(sub); $event.stopPropagation()">
          <i [ngClass]="sub.icon" style="min-width: 20px;"></i>
          <span class="ms-2 text-truncate">{{ sub.titre }}</span>
        </div>
      </div>
    </ng-container>

  </div> <div class="sidebar-footer border-top border-secondary border-opacity-10 p-3 flex-shrink-0" *ngIf="!collapsed">

  <div class="user-profile d-flex align-items-center gap-2 bg-dark bg-opacity-50 p-2 rounded-3 border border-secondary border-opacity-10 mb-2">

    <div class="user-avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold shadow-sm"
         style="min-width: 38px; height: 38px;">
      AB
    </div>

    <div class="user-info flex-grow-1 overflow-hidden">
      <div class="user-name text-white fw-bold text-truncate small">Jeeri</div>
      <div class="user-role text-muted text-truncate" style="font-size: 0.7rem;">Administrateur</div>
    </div>

    <div class="dropup">
      <i class="fas fa-ellipsis-v text-muted px-2 pointer small" data-bs-toggle="dropdown" aria-expanded="false"></i>
      <ul class="dropdown-menu dropdown-menu-dark shadow">
        <li><a class="dropdown-item small" href="#"><i class="fas fa-user me-2"></i>Profil</a></li>
        <li><a class="dropdown-item small" href="#"><i class="fas fa-cog me-2"></i>Paramètres</a></li>
        <li><hr class="dropdown-divider border-secondary"></li>
        <li><a class="dropdown-item small text-danger" href="#"><i class="fas fa-sign-out-alt me-2"></i>Déconnexion</a></li>
      </ul>
    </div>

  </div>
</div>

</nav>
